- hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH to come up
      wait_for_connection:
        timeout: 300

    - name: Wait for first-boot setup to finish
      command: cloud-init status --wait
      changed_when: false

- hosts: all
  roles:
    - hardening
    - node_exporter
    - k3s_prereqs

- hosts: server
  roles:
    - k3s_server

- hosts: agents
  roles:
    - k3s_agent
